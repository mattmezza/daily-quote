<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daily‑quote</title>
  <meta property="og:title" content="daily‑quote">
  <meta property="og:description" content="A daily dose of inspiration — beautiful quotes, one at a time.">
  <meta property="og:image" content="https://daily-quote.products.humux.dev/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://daily-quote.products.humux.dev/">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="daily‑quote">
  <meta name="twitter:description" content="A daily dose of inspiration — beautiful quotes, one at a time.">
  <script src="quotes.js"></script>
  <style>
    /* Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F9F6F1;
      color: #2C2C2C;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Main container */
    .quote-container {
      max-width: 640px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }

    /* Quote text */
    .quote-text {
      font-family: Georgia, "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-size: 1.75rem;
      line-height: 1.6;
      font-weight: 400;
      color: #2C2C2C;
      letter-spacing: 0.01em;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .quote-text.visible {
      opacity: 1;
    }

    /* Drop cap — first letter */
    .quote-text::first-letter {
      font-size: 3.2rem;
      line-height: 0.8;
      padding-right: 0.08em;
      color: #C4A882;
      float: left;
    }

    /* Decorative separator */
    .separator {
      margin: 1.75rem auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .separator::before,
    .separator::after {
      content: "";
      display: block;
      width: 1.5rem;
      height: 1px;
      background: #C4A882;
    }

    .separator-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #C4A882;
    }

    /* Author */
    .quote-author {
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #8B7E74;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .quote-author.visible {
      opacity: 1;
    }

    /* Refresh button */
    .refresh-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #8B7E74;
      background: transparent;
      border: 1px solid #D4CEC6;
      border-radius: 2px;
      cursor: pointer;
      transition: all 250ms ease;
    }

    .refresh-btn:hover {
      color: #2C2C2C;
      border-color: #C4A882;
      background: rgba(196, 168, 130, 0.08);
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    /* Attribution */
    .attribution {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: #D4CEC6;
      letter-spacing: 0.04em;
    }

    @media (max-width: 480px) {
      .quote-text {
        font-size: 1.35rem;
      }

      .quote-text::first-letter {
        font-size: 2.6rem;
      }

      .quote-container {
        padding: 1.5rem;
      }

      .refresh-btn {
        padding: 0.5rem 1.25rem;
        font-size: 0.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0s !important;
      }
    }
  </style>
</head>
<body>
  <main class="quote-container">
    <p class="quote-text" id="quote-text"></p>
    <div class="separator" aria-hidden="true">
      <span class="separator-dot"></span>
    </div>
    <p class="quote-author" id="quote-author"></p>
    <button class="refresh-btn" id="refresh-btn">New Quote</button>
  </main>
  <p class="attribution">daily‑quote</p>

  <script>
    function getRandomInt(max) {
      return Math.floor(Math.random() * max);
    }

    let refreshTimeout = null;

    function refreshQuote() {
      if (refreshTimeout) return;

      const textEl = document.getElementById('quote-text');
      const authorEl = document.getElementById('quote-author');
      const btn = document.getElementById('refresh-btn');

      refreshTimeout = true;
      btn.disabled = true;

      // Fade out
      textEl.classList.remove('visible');
      authorEl.classList.remove('visible');

      setTimeout(() => {
        const index = getRandomInt(QUOTES.length);
        textEl.textContent = QUOTES[index].text;
        authorEl.textContent = QUOTES[index].author;

        // Fade in
        textEl.classList.add('visible');
        authorEl.classList.add('visible');
        refreshTimeout = null;
        btn.disabled = false;
      }, 400);
    }

    document.addEventListener('DOMContentLoaded', () => {
      const textEl = document.getElementById('quote-text');
      const authorEl = document.getElementById('quote-author');

      // Set initial quote
      const index = getRandomInt(QUOTES.length);
      textEl.textContent = QUOTES[index].text;
      authorEl.textContent = QUOTES[index].author;

      // Fade in on next tick (no flash on load)
      setTimeout(() => {
        textEl.classList.add('visible');
        authorEl.classList.add('visible');
      }, 20);

      // Wire up button
      document.getElementById('refresh-btn').addEventListener('click', refreshQuote);
    });
  </script>
</body>
</html>
