<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daily&#8209;quote</title>
  <script src="quotes.js"></script>
  <style>
    /* Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F9F6F1;
      color: #2C2C2C;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 600ms ease;
    }

    /* Mood colour variables — set by JS */
    :root {
      --mood-accent: #C4A882;
      --mood-accent-subtle: rgba(196, 168, 130, 0.08);
      --mood-border: #D4CEC6;
      --mood-text-subtle: #8B7E74;
    }

    /* Main container */
    .quote-container {
      max-width: 640px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }

    /* Quote text */
    .quote-text {
      font-family: Georgia, "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-size: 1.75rem;
      line-height: 1.6;
      font-weight: 400;
      color: #2C2C2C;
      letter-spacing: 0.01em;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .quote-text.visible {
      opacity: 1;
    }

    /* Daily quote — slower fade-in for the initial daily pick */
    .quote-text.daily,
    .quote-author.daily {
      transition: opacity 800ms ease;
    }

    /* Drop cap — first letter */
    .quote-text::first-letter {
      font-size: 3.2rem;
      line-height: 0.8;
      padding-right: 0.08em;
      color: var(--mood-accent);
      float: left;
      transition: color 600ms ease;
    }

    /* Decorative separator */
    .separator {
      margin: 1.75rem auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .separator::before,
    .separator::after {
      content: "";
      display: block;
      width: 1.5rem;
      height: 1px;
      background: var(--mood-accent);
      transition: background 600ms ease;
    }

    .separator-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--mood-accent);
      transition: background 600ms ease;
    }

    /* Author */
    .quote-author {
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      opacity: 0;
      transition: opacity 400ms ease, color 600ms ease;
    }

    .quote-author.visible {
      opacity: 1;
    }

    /* Refresh button */
    .refresh-btn {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.6rem 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      background: transparent;
      border: 1px solid var(--mood-border);
      border-radius: 2px;
      cursor: pointer;
      transition: all 250ms ease;
    }

    .refresh-btn:hover {
      color: #2C2C2C;
      border-color: var(--mood-accent);
      background: var(--mood-accent-subtle);
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    /* Daily badge — shown on initial daily quote */
    .daily-badge {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mood-accent);
      opacity: 0;
      transition: opacity 400ms ease, color 600ms ease;
    }

    .daily-badge.visible {
      opacity: 1;
    }

    /* Attribution */
    .attribution {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--mood-border);
      letter-spacing: 0.04em;
      transition: color 600ms ease;
    }

    @media (max-width: 480px) {
      .quote-text {
        font-size: 1.35rem;
      }

      .quote-text::first-letter {
        font-size: 2.6rem;
      }

      .quote-container {
        padding: 1.5rem;
      }

      .refresh-btn {
        padding: 0.5rem 1.25rem;
        font-size: 0.75rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0s !important;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background: #1A1A1A;
        color: #E0E0E0;
      }

      .quote-text {
        color: #E0E0E0;
      }

      .refresh-btn:hover {
        color: #E0E0E0;
      }
    }
  </style>
</head>
<body>
  <main class="quote-container">
    <p class="quote-text" id="quote-text"></p>
    <div class="separator" aria-hidden="true">
      <span class="separator-dot"></span>
    </div>
    <p class="quote-author" id="quote-author"></p>
    <button class="refresh-btn" id="refresh-btn">New Quote</button>
    <span class="daily-badge" id="daily-badge">Today&#8217;s Quote</span>
  </main>
  <p class="attribution">daily&#8209;quote</p>

  <script>
    // ---- mood colour palettes ----
    var MOOD_COLORS = {
      wisdom: {
        light: { bg: '#ebe5f0', accent: '#7c6f9e', border: '#c8c0d8' },
        dark:  { bg: '#1a1a2e', accent: '#b8a9d4', border: '#3a3a5e' }
      },
      motivation: {
        light: { bg: '#f5ede0', accent: '#c4944a', border: '#dcc8a8' },
        dark:  { bg: '#1e1a14', accent: '#e8b85a', border: '#3a3024' }
      },
      calm: {
        light: { bg: '#e0ece8', accent: '#5a8f8a', border: '#b8d0cc' },
        dark:  { bg: '#141e1c', accent: '#7ab8b0', border: '#2a3a36' }
      },
      joy: {
        light: { bg: '#f8ece8', accent: '#c47a82', border: '#dcc0c4' },
        dark:  { bg: '#1e1418', accent: '#e89aa8', border: '#3a2830' }
      },
      reflection: {
        light: { bg: '#e4e0ec', accent: '#7e7ab5', border: '#c4c0d8' },
        dark:  { bg: '#141420', accent: '#a09cd4', border: '#2e2c48' }
      }
    };

    function getMoodColors(mood) {
      var palette = MOOD_COLORS[mood] || MOOD_COLORS.wisdom;
      var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      return isDark ? palette.dark : palette.light;
    }

    function applyMood(mood) {
      var colors = getMoodColors(mood);
      var root = document.documentElement;
      root.style.setProperty('--mood-accent', colors.accent);
      // Derive subtle accent (8% opacity of accent)
      root.style.setProperty('--mood-accent-subtle', hexToRgba(colors.accent, 0.08));
      root.style.setProperty('--mood-border', colors.border);
      // Estimate readable text colour from background
      document.body.style.background = colors.bg;
    }

    // Convert hex to rgba string
    function hexToRgba(hex, alpha) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    // Listen for dark mode changes
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
      if (currentMood) applyMood(currentMood);
    });

    // ---- helpers ----
    function getRandomInt(max) {
      return Math.floor(Math.random() * max);
    }

    // Deterministic daily index using date string hash
    function getDailyIndex() {
      var dateStr = new Date().toDateString();
      var hash = 0;
      for (var i = 0; i < dateStr.length; i++) {
        hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % QUOTES.length;
    }

    // ---- state ----
    var refreshTimeout = null;
    var dailyIndex = getDailyIndex();
    var currentIsDaily = true;
    var currentMood = null;

    // ---- DOM refs ----
    var textEl = document.getElementById('quote-text');
    var authorEl = document.getElementById('quote-author');
    var badgeEl = document.getElementById('daily-badge');
    var btn = document.getElementById('refresh-btn');

    function showQuote(index, isDaily) {
      var quote = QUOTES[index];
      textEl.textContent = quote.text;
      authorEl.textContent = quote.author;
      currentIsDaily = isDaily;
      currentMood = quote.mood;

      applyMood(quote.mood);

      if (isDaily) {
        textEl.classList.add('daily');
        authorEl.classList.add('daily');
        badgeEl.classList.add('visible');
      } else {
        textEl.classList.remove('daily');
        authorEl.classList.remove('daily');
        badgeEl.classList.remove('visible');
      }

      // Fade in
      textEl.classList.add('visible');
      authorEl.classList.add('visible');
    }

    function refreshQuote() {
      if (refreshTimeout) return;

      refreshTimeout = true;
      btn.disabled = true;

      // Fade out
      textEl.classList.remove('visible');
      authorEl.classList.remove('visible');
      badgeEl.classList.remove('visible');

      setTimeout(function () {
        var index = getRandomInt(QUOTES.length);
        showQuote(index, false);
        refreshTimeout = null;
        btn.disabled = false;
      }, 400);
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Set initial daily quote
      showQuote(dailyIndex, true);

      // Wire up button
      btn.addEventListener('click', refreshQuote);
    });
  </script>
</body>
</html>
