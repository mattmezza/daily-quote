<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>daily&#8209;quote</title>
  <meta property="og:title" content="daily-quote">
  <meta property="og:description" content="A daily dose of inspiration — curated quotes to start your day.">
  <meta property="og:image" content="https://raw.githubusercontent.com/mattmezza/daily-quote/main/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="daily-quote">
  <meta name="twitter:description" content="A daily dose of inspiration — curated quotes to start your day.">
  <meta name="twitter:image" content="https://raw.githubusercontent.com/mattmezza/daily-quote/main/og-image.png">
  <script src="quotes.js"></script>
  <script>(function(){try{var t=localStorage.getItem('daily-quote-theme')||(window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t)}catch(e){}})()</script>
  <style>
    /* Reset */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #F9F6F1;
      color: #2C2C2C;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 600ms ease, color 600ms ease;
    }

    /* Mood colour variables — set by JS */
    :root {
      --mood-accent: #C4A882;
      --mood-accent-subtle: rgba(196, 168, 130, 0.08);
      --mood-border: #D4CEC6;
      --mood-text-subtle: #8B7E74;
    }

    /* Main container */
    .quote-container {
      max-width: 640px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }

    /* Quote text */
    .quote-text {
      font-family: Georgia, "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-size: 1.75rem;
      line-height: 1.6;
      font-weight: 400;
      color: #2C2C2C;
      letter-spacing: 0.01em;
      opacity: 0;
      transition: opacity 400ms ease;
    }

    .quote-text.visible {
      opacity: 1;
    }

    /* Daily quote — slower fade-in for the initial daily pick */
    .quote-text.daily,
    .quote-author.daily {
      transition: opacity 800ms ease;
    }

    /* Drop cap — first letter */
    .quote-text::first-letter {
      font-size: 3.2rem;
      line-height: 0.8;
      padding-right: 0.08em;
      color: var(--mood-accent);
      float: left;
      transition: color 600ms ease;
    }

    /* Decorative separator */
    .separator {
      margin: 1.75rem auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .separator::before,
    .separator::after {
      content: "";
      display: block;
      width: 1.5rem;
      height: 1px;
      background: var(--mood-accent);
      transition: background 600ms ease;
    }

    .separator-dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: var(--mood-accent);
      transition: background 600ms ease;
    }

    /* Author */
    .quote-author {
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      opacity: 0;
      transition: opacity 400ms ease, color 600ms ease;
    }

    .quote-author.visible {
      opacity: 1;
    }

    /* Actions row */
    .actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    /* Icon buttons (share, star) */
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.4rem;
      height: 2.4rem;
      padding: 0;
      background: transparent;
      border: 1px solid var(--mood-border);
      border-radius: 2px;
      cursor: pointer;
      color: var(--mood-text-subtle);
      transition: all 250ms ease;
    }

    .icon-btn:hover {
      color: #2C2C2C;
      border-color: var(--mood-accent);
      background: var(--mood-accent-subtle);
    }

    [data-theme="dark"] .icon-btn:hover {
      color: #E0E0E0;
    }

    .icon-btn:active {
      transform: scale(0.97);
    }

    /* Theme toggle — sun/moon icon */
    .theme-btn .sun-icon,
    .theme-btn .moon-icon {
      transition: opacity 300ms ease, transform 300ms ease;
    }

    .theme-btn .moon-icon {
      display: none;
    }

    [data-theme="dark"] .theme-btn .sun-icon {
      display: none;
    }

    [data-theme="dark"] .theme-btn .moon-icon {
      display: inline;
    }

    .icon-btn svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .share-btn.shared svg {
      stroke: var(--mood-accent);
    }

    /* Star button — filled state */
    .star-btn.filled svg .star-fill {
      fill: currentColor;
    }

    .star-btn.filled {
      color: var(--mood-accent);
      border-color: var(--mood-accent);
    }

    /* Refresh button */
    .refresh-btn {
      display: inline-block;
      padding: 0.6rem 1.5rem;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      background: transparent;
      border: 1px solid var(--mood-border);
      border-radius: 2px;
      cursor: pointer;
      transition: all 250ms ease;
    }

    .refresh-btn:hover {
      color: #2C2C2C;
      border-color: var(--mood-accent);
      background: var(--mood-accent-subtle);
    }

    .refresh-btn:active {
      transform: scale(0.97);
    }

    /* Daily badge — shown on initial daily quote */
    .daily-badge {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mood-accent);
      opacity: 0;
      transition: opacity 400ms ease, color 600ms ease;
    }

    .daily-badge.visible {
      opacity: 1;
    }

    /* Favourites nav link */
    .favourites-nav {
      display: block;
      margin-top: 0.75rem;
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      background: none;
      border: none;
      cursor: pointer;
      transition: color 250ms ease;
    }

    .favourites-nav:hover {
      color: var(--mood-accent);
    }

    .favourites-nav .count {
      display: inline-block;
      margin-left: 0.3rem;
      font-size: 0.65rem;
      vertical-align: super;
    }

    /* Favourites view */
    .favourites-view {
      display: none;
      text-align: left;
    }

    .favourites-view.active {
      display: block;
    }

    /* Hide main view when favourites is active */
    .quote-view.hidden {
      display: none;
    }

    .favourites-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
    }

    .favourites-title {
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--mood-accent);
    }

    .back-btn {
      font-size: 0.75rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      background: none;
      border: 1px solid var(--mood-border);
      border-radius: 2px;
      padding: 0.4rem 0.9rem;
      cursor: pointer;
      transition: all 250ms ease;
    }

    .back-btn:hover {
      color: #2C2C2C;
      border-color: var(--mood-accent);
      background: var(--mood-accent-subtle);
    }

    /* Favourites list */
    .favourites-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .favourite-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--mood-border);
      border-radius: 2px;
      transition: border-color 250ms ease;
    }

    .favourite-item:hover {
      border-color: var(--mood-accent);
    }

    .favourite-item .fav-text {
      flex: 1;
      font-family: Georgia, "Palatino Linotype", Palatino, "Book Antiqua", serif;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .favourite-item .fav-author {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--mood-text-subtle);
      margin-top: 0.3rem;
    }

    .favourite-item .unstar-btn {
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2rem;
      height: 2rem;
      padding: 0;
      background: transparent;
      border: 1px solid var(--mood-border);
      border-radius: 2px;
      cursor: pointer;
      color: var(--mood-accent);
      transition: all 250ms ease;
    }

    .favourite-item .unstar-btn:hover {
      background: var(--mood-accent-subtle);
      border-color: var(--mood-accent);
      transform: scale(0.97);
    }

    .favourite-item .unstar-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Empty state */
    .favourites-empty {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--mood-text-subtle);
    }

    .favourites-empty p {
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .favourites-empty .empty-icon {
      margin-bottom: 1rem;
      opacity: 0.4;
    }

    .favourites-empty .empty-icon svg {
      width: 40px;
      height: 40px;
      stroke: var(--mood-text-subtle);
      fill: none;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Toast notification */
    .toast {
      position: fixed;
      bottom: 3rem;
      left: 50%;
      transform: translateX(-50%) translateY(1rem);
      padding: 0.6rem 1.2rem;
      font-size: 0.8rem;
      color: #fff;
      background: #2C2C2C;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      transition: all 300ms ease;
      white-space: nowrap;
    }

    [data-theme="dark"] .toast {
      background: #E0E0E0;
      color: #1A1A1A;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Attribution */
    .attribution {
      position: fixed;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.7rem;
      color: var(--mood-border);
      letter-spacing: 0.04em;
      transition: color 600ms ease;
    }

    @media (max-width: 480px) {
      .quote-text {
        font-size: 1.35rem;
      }

      .quote-text::first-letter {
        font-size: 2.6rem;
      }

      .quote-container {
        padding: 1.5rem;
      }

      .refresh-btn {
        padding: 0.5rem 1.25rem;
        font-size: 0.75rem;
      }

      .icon-btn {
        width: 2rem;
        height: 2rem;
      }

      .icon-btn svg {
        width: 15px;
        height: 15px;
      }

      .favourite-item {
        padding: 0.8rem;
      }

      .favourite-item .fav-text {
        font-size: 0.85rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0s !important;
      }
    }

    [data-theme="dark"] body {
      background: #1A1A1A;
      color: #E0E0E0;
    }

    [data-theme="dark"] .quote-text {
      color: #E0E0E0;
    }

    [data-theme="dark"] .refresh-btn:hover {
      color: #E0E0E0;
    }

    [data-theme="dark"] .back-btn:hover {
      color: #E0E0E0;
    }
  </style>
</head>
<body>
  <main class="quote-container">
    <!-- Main quote view -->
    <div class="quote-view" id="quote-view">
      <p class="quote-text" id="quote-text"></p>
      <div class="separator" aria-hidden="true">
        <span class="separator-dot"></span>
      </div>
      <p class="quote-author" id="quote-author"></p>
      <div class="actions">
        <button class="refresh-btn" id="refresh-btn">New Quote</button>
        <button class="icon-btn star-btn" id="star-btn" aria-label="Toggle favourite">
          <svg viewBox="0 0 24 24">
            <path class="star-fill" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        </button>
        <button class="icon-btn share-btn" id="share-btn" aria-label="Share this quote">
          <svg viewBox="0 0 24 24">
            <path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/>
            <polyline points="16 6 12 2 8 6"/>
            <line x1="12" y1="2" x2="12" y2="15"/>
          </svg>
        </button>
        <button class="icon-btn theme-btn" id="theme-btn" aria-label="Toggle theme">
          <svg class="sun-icon" viewBox="0 0 24 24" width="18" height="18">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
          <svg class="moon-icon" viewBox="0 0 24 24" width="18" height="18">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
      <span class="daily-badge" id="daily-badge">Today&#8217;s Quote</span>
    </div>

    <!-- Favourites view -->
    <div class="favourites-view" id="favourites-view">
      <div class="favourites-header">
        <span class="favourites-title">Favourites</span>
        <button class="back-btn" id="back-btn">Back</button>
      </div>
      <div id="favourites-content"></div>
    </div>

    <!-- Nav -->
    <button class="favourites-nav" id="favourites-nav">
      &#9829; Favourites<span class="count" id="fav-count"></span>
    </button>

    <div class="toast" id="toast"></div>
  </main>
  <p class="attribution">daily&#8209;quote</p>

  <script>
    // ---- mood colour palettes ----
    var MOOD_COLORS = {
      wisdom: {
        light: { bg: '#ebe5f0', accent: '#7c6f9e', border: '#c8c0d8' },
        dark:  { bg: '#1a1a2e', accent: '#b8a9d4', border: '#3a3a5e' }
      },
      motivation: {
        light: { bg: '#f5ede0', accent: '#c4944a', border: '#dcc8a8' },
        dark:  { bg: '#1e1a14', accent: '#e8b85a', border: '#3a3024' }
      },
      calm: {
        light: { bg: '#e0ece8', accent: '#5a8f8a', border: '#b8d0cc' },
        dark:  { bg: '#141e1c', accent: '#7ab8b0', border: '#2a3a36' }
      },
      joy: {
        light: { bg: '#f8ece8', accent: '#c47a82', border: '#dcc0c4' },
        dark:  { bg: '#1e1418', accent: '#e89aa8', border: '#3a2830' }
      },
      reflection: {
        light: { bg: '#e4e0ec', accent: '#7e7ab5', border: '#c4c0d8' },
        dark:  { bg: '#141420', accent: '#a09cd4', border: '#2e2c48' }
      }
    };

    function getMoodColors(mood) {
      var palette = MOOD_COLORS[mood] || MOOD_COLORS.wisdom;
      var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      return isDark ? palette.dark : palette.light;
    }

    function applyMood(mood) {
      var colors = getMoodColors(mood);
      var root = document.documentElement;
      root.style.setProperty('--mood-accent', colors.accent);
      // Derive subtle accent (8% opacity of accent)
      root.style.setProperty('--mood-accent-subtle', hexToRgba(colors.accent, 0.08));
      root.style.setProperty('--mood-border', colors.border);
      // Estimate readable text colour from background
      document.body.style.background = colors.bg;
    }

    // Convert hex to rgba string
    function hexToRgba(hex, alpha) {
      var r = parseInt(hex.slice(1, 3), 16);
      var g = parseInt(hex.slice(3, 5), 16);
      var b = parseInt(hex.slice(5, 7), 16);
      return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
    }

    // Listen for system dark mode changes (only when no explicit user preference)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function (e) {
      if (!localStorage.getItem('daily-quote-theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        if (currentMood) applyMood(currentMood);
      }
    });

    // ---- helpers ----
    function getRandomInt(max) {
      return Math.floor(Math.random() * max);
    }

    // Deterministic daily index using date string hash
    function getDailyIndex() {
      var dateStr = new Date().toDateString();
      var hash = 0;
      for (var i = 0; i < dateStr.length; i++) {
        hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash) % QUOTES.length;
    }

    // ---- favourites (localStorage) ----
    var FAV_KEY = 'daily-quote-favourites';
    var FAV_MAX = 100;

    function getFavourites() {
      try {
        var data = localStorage.getItem(FAV_KEY);
        return data ? JSON.parse(data) : [];
      } catch (e) {
        return [];
      }
    }

    function saveFavourites(favs) {
      try {
        localStorage.setItem(FAV_KEY, JSON.stringify(favs));
      } catch (e) {
        // localStorage full or unavailable
      }
    }

    function toggleFavourite(index) {
      var favs = getFavourites();
      var idx = favs.indexOf(index);
      if (idx !== -1) {
        favs.splice(idx, 1);
      } else {
        if (favs.length >= FAV_MAX) {
          showToast('Max ' + FAV_MAX + ' favourites');
          return false;
        }
        favs.push(index);
      }
      saveFavourites(favs);
      return true;
    }

    function isFavourite(index) {
      return getFavourites().indexOf(index) !== -1;
    }

    function updateStarUI(index) {
      if (isFavourite(index)) {
        starBtn.classList.add('filled');
      } else {
        starBtn.classList.remove('filled');
      }
    }

    function updateFavCount() {
      var favs = getFavourites();
      favCountEl.textContent = favs.length > 0 ? '(' + favs.length + ')' : '';
    }

    function renderFavourites() {
      var favs = getFavourites();
      var container = favContentEl;

      if (favs.length === 0) {
        container.innerHTML =
          '<div class="favourites-empty">' +
            '<div class="empty-icon">' +
              '<svg viewBox="0 0 24 24">' +
                '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>' +
              '</svg>' +
            '</div>' +
            '<p>No favourites yet.</p>' +
            '<p style="margin-top:0.3rem;font-size:0.8rem;">Tap the star on a quote to save it here.</p>' +
          '</div>';
        return;
      }

      var html = '<ul class="favourites-list">';
      for (var i = 0; i < favs.length; i++) {
        var qi = favs[i];
        var q = QUOTES[qi];
        if (!q) continue;
        html +=
          '<li class="favourite-item">' +
            '<div class="fav-text">' +
              escapeHtml(q.text) +
              '<div class="fav-author">' + escapeHtml(q.author) + '</div>' +
            '</div>' +
            '<button class="unstar-btn" data-index="' + qi + '" aria-label="Remove from favourites">' +
              '<svg viewBox="0 0 24 24">' +
                '<path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>' +
              '</svg>' +
            '</button>' +
          '</li>';
      }
      html += '</ul>';
      container.innerHTML = html;

      // Wire unstar buttons
      container.querySelectorAll('.unstar-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var idx = parseInt(this.getAttribute('data-index'), 10);
          removeFavourite(idx);
        });
      });
    }

    function removeFavourite(index) {
      var favs = getFavourites();
      var idx = favs.indexOf(index);
      if (idx !== -1) {
        favs.splice(idx, 1);
        saveFavourites(favs);
        renderFavourites();
        updateFavCount();
        updateStarUI(currentIndex);
        showToast('Removed from favourites');
      }
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    // ---- state ----
    var refreshTimeout = null;
    var dailyIndex = getDailyIndex();
    var currentIsDaily = true;
    var currentMood = null;
    var currentIndex = dailyIndex;
    var showingFavourites = false;

    // ---- DOM refs ----
    var quoteViewEl = document.getElementById('quote-view');
    var textEl = document.getElementById('quote-text');
    var authorEl = document.getElementById('quote-author');
    var badgeEl = document.getElementById('daily-badge');
    var btn = document.getElementById('refresh-btn');
    var shareBtn = document.getElementById('share-btn');
    var starBtn = document.getElementById('star-btn');
    var favNavEl = document.getElementById('favourites-nav');
    var favCountEl = document.getElementById('fav-count');
    var favViewEl = document.getElementById('favourites-view');
    var favContentEl = document.getElementById('favourites-content');
    var backBtn = document.getElementById('back-btn');
    var toastEl = document.getElementById('toast');
    var themeBtn = document.getElementById('theme-btn');

    function showQuote(index, isDaily) {
      currentIndex = index;
      var quote = QUOTES[index];
      textEl.textContent = quote.text;
      authorEl.textContent = quote.author;
      currentIsDaily = isDaily;
      currentMood = quote.mood;

      applyMood(quote.mood);
      updateStarUI(index);

      if (isDaily) {
        textEl.classList.add('daily');
        authorEl.classList.add('daily');
        badgeEl.classList.add('visible');
      } else {
        textEl.classList.remove('daily');
        authorEl.classList.remove('daily');
        badgeEl.classList.remove('visible');
      }

      // Fade in
      textEl.classList.add('visible');
      authorEl.classList.add('visible');
    }

    function refreshQuote() {
      if (refreshTimeout) return;

      refreshTimeout = true;
      btn.disabled = true;

      // Fade out
      textEl.classList.remove('visible');
      authorEl.classList.remove('visible');
      badgeEl.classList.remove('visible');

      setTimeout(function () {
        var index = getRandomInt(QUOTES.length);
        showQuote(index, false);
        refreshTimeout = null;
        btn.disabled = false;
      }, 400);
    }

    // ---- theme toggle ----
    function handleThemeToggle() {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try {
        if (next === 'light') {
          localStorage.removeItem('daily-quote-theme');
        } else {
          localStorage.setItem('daily-quote-theme', next);
        }
      } catch (e) {}
      if (currentMood) applyMood(currentMood);
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('visible');
      clearTimeout(toastEl._hide);
      toastEl._hide = setTimeout(function () {
        toastEl.classList.remove('visible');
      }, 2000);
    }

    function shareQuote() {
      var quote = textEl.textContent;
      var author = authorEl.textContent;
      var shareData = {
        title: 'daily-quote',
        text: quote + ' \u2014 ' + author,
        url: 'https://daily-quote.products.humux.dev'
      };

      if (navigator.share) {
        navigator.share(shareData).then(function () {
          shareBtn.classList.add('shared');
          setTimeout(function () { shareBtn.classList.remove('shared'); }, 1500);
        }).catch(function () {
          // user cancelled or error — do nothing
        });
      } else {
        // Fallback: clipboard copy
        var fullText = shareData.text + '\n' + shareData.url;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(fullText).then(function () {
            showToast('Link copied');
          }).catch(function () {
            showToast('Could not copy');
          });
        } else {
          // Last-resort fallback using textarea
          var ta = document.createElement('textarea');
          ta.value = fullText;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand('copy');
            showToast('Link copied');
          } catch (e) {
            showToast('Could not copy');
          }
          document.body.removeChild(ta);
        }
      }
    }

    function showFavourites() {
      showingFavourites = true;
      quoteViewEl.classList.add('hidden');
      favViewEl.classList.add('active');
      renderFavourites();
    }

    function hideFavourites() {
      showingFavourites = false;
      quoteViewEl.classList.remove('hidden');
      favViewEl.classList.remove('active');
    }

    // ---- toggle favourite ----
    function handleStarToggle() {
      if (toggleFavourite(currentIndex)) {
        updateStarUI(currentIndex);
        updateFavCount();
        if (isFavourite(currentIndex)) {
          showToast('Added to favourites');
        } else {
          showToast('Removed from favourites');
        }
      }
    }

    document.addEventListener('DOMContentLoaded', function () {
      // Set initial daily quote
      showQuote(dailyIndex, true);
      updateFavCount();

      // Wire up buttons
      btn.addEventListener('click', refreshQuote);
      shareBtn.addEventListener('click', shareQuote);
      starBtn.addEventListener('click', handleStarToggle);
      themeBtn.addEventListener('click', handleThemeToggle);
      favNavEl.addEventListener('click', showFavourites);
      backBtn.addEventListener('click', hideFavourites);
    });
  </script>
</body>
</html>
